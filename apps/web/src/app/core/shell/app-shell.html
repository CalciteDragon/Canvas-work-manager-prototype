<div class="shell">
  <app-top-bar
    class="top"
    [identity]="store.identity()"
    [menuAvailable]="narrow()"
    [menuOpen]="drawerOpen()"
    [attr.inert]="drawerOpen() ? '' : null"
    (menuRequested)="openDrawer()"
  />

  @if (drawerOpen()) {
    <!-- A button rather than a click handler on a div, as the development panel's is:
         dismissing the drawer is a real action. -->
    <button
      type="button"
      class="backdrop"
      data-shell-drawer-backdrop
      aria-label="Close navigation"
      (click)="dismissDrawer()"
    ></button>
  }

  <!-- One sidebar at every width. Below the breakpoint the same instance is the drawer, so its
       expanded group and its create-form draft survive being opened and closed. The dialog
       attributes exist only while it is open; the wrapper keeps the focus trap's anchors out
       of the shell's grid. -->
  <div class="side" [class.side--open]="drawerOpen()" [class.side--closed]="narrow() && !drawerOpen()">
    <div
      #drawer
      id="shell-navigation"
      class="drawer"
      [attr.role]="drawerOpen() ? 'dialog' : null"
      [attr.aria-modal]="drawerOpen() ? 'true' : null"
      [attr.aria-label]="drawerOpen() ? 'Navigation' : null"
      [attr.tabindex]="drawerOpen() ? -1 : null"
      [attr.inert]="narrow() && !drawerOpen() ? '' : null"
      [cdkTrapFocus]="drawerOpen()"
      (keydown.escape)="dismissDrawer()"
      (click)="onDrawerClick($event)"
    >
      <app-sidebar
        class="drawer__nav"
        [projectTree]="store.projectTree()"
        [failure]="store.error()"
        [loading]="store.loading()"
        [createError]="store.createError()"
        [hasArchived]="store.hasArchived()"
        [projectPlace]="navigation.place()"
        [projectActions]="navigation.hasHandlers()"
        (createRequested)="createProject($event)"
        (retryRequested)="store.load()"
        (pageSettingsRequested)="toPlace($event, 'openPageSettings')"
        (addWorkstreamRequested)="toPlace($event, 'openAddWorkstream')"
      />
      @if (drawerOpen()) {
        <!-- Slice 81 (decision 4): no visible Close; the tree's action row is the drawer's top row.
             The last Tab stop dismisses, visually hidden until it has focus (the skip link's
             pattern), so a keyboard user sees it and a screen reader, kept inside by
             `aria-modal`, can reach it. -->
        <button type="button" class="button drawer__dismiss" data-shell-drawer-dismiss (click)="dismissDrawer()">Close navigation</button>
      }
    </div>
  </div>

  <!-- Focusable so a drawer that closed behind a chosen link can hand focus to what it opened. -->
  <main #main class="workspace" tabindex="-1" [attr.inert]="drawerOpen() ? '' : null">
    <router-outlet />
    <!-- Off-screen write failures pinned to this scroll port's edges; out of flow, so no geometry. -->
    <app-pinned-failure-slot />
  </main>
</div>
