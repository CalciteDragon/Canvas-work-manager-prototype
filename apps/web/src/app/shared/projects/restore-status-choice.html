<label class="control-label">
  Restore as
  <!-- Options come from @for, which renders after the select's own bindings: a [value] on the
       select would find no option and show the first one, so each option says whether it is selected. -->
  <select
    class="select"
    data-restore-status
    [disabled]="disabled()"
    [attr.aria-disabled]="pending() && !disabled() ? 'true' : null"
    (change)="choose($any($event.target))"
  >
    @for (option of statuses; track option) {
      <option [value]="option" [selected]="option === status()">{{ labels[option] }}</option>
    }
  </select>
</label>
<button
  type="button"
  class="button button--sm"
  data-restore-action
  [disabled]="disabled()"
  [attr.aria-disabled]="pending() && !disabled() ? 'true' : null"
  [attr.aria-label]="'Restore ' + subjectLabel()"
  (click)="press()"
>
  {{ pending() ? 'Restoring…' : 'Restore' }}
</button>
