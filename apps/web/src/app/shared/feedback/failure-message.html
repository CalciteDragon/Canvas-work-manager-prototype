<p class="state-message__sentence" data-failure-sentence [class.field-status]="weight() === 'inline'" [class.field-status--failed]="weight() === 'inline'"
  [attr.id]="sentenceId()" [attr.role]="live()">{{ failure().sentence }}</p>
@if (recovery(); as recovery) {
  <button #recoveryButton type="button" class="button button--sm" [attr.data-recovery]="recovery" [attr.aria-disabled]="pending() ? 'true' : null" (click)="press(recoveryButton)">{{ labels[recovery] }}</button>
}
@if (failure().reason; as reason) {
  <details class="state-message__details"><summary>Details</summary><p>{{ reason }}</p></details>
}
