@if (dashboard().dailyDigest; as digest) {
  <div class="widget-prose">
    @for (line of digest.lines; track $index) {
      <p data-widget-digest-line class="widget-prose__line">{{ line }}</p>
    }
  </div>

  <p data-widget-digest-source class="widget-source">
    {{ digest.source === 'prototype' ? 'Composed locally by the prototype AI provider' : 'Generated by the configured AI provider' }}
  </p>
}
