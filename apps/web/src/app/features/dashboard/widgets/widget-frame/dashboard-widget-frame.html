<header class="widget-frame__header">
  <span class="widget-frame__icon"><app-icon [name]="definition().icon" /></span>
  <h2 data-widget-title class="widget-frame__title">{{ definition().displayName }}</h2>
</header>

<div data-widget-content class="widget-frame__content">
  @if (failure(); as failure) {
    <app-failure-message data-widget-failure [failure]="failure" recovery="try-again" [pending]="pending()" (retry)="retry.emit()" />
  } @else {
    <ng-container [ngComponentOutlet]="definition().component" [ngComponentOutletInputs]="contentInputs()" />
  }
</div>
