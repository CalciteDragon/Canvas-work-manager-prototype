<div class="markdown-source-editor" [attr.aria-busy]="pending()">
  @if (initialDraft() !== null) {
    <p data-markdown-restored class="markdown-source-editor__restored" role="status">
      <span class="markdown-source-editor__note">Your unsaved draft is back.</span>
      <button data-markdown-discard type="button" class="button button--ghost" [attr.aria-disabled]="pending()"
        (click)="requestDiscard()">Discard draft</button>
    </p>
  }
  @if (preview()) {
    <p data-markdown-preview-caption class="markdown-source-editor__note">Unsaved preview</p>
    <app-markdown-renderer [source]="draft()" />
  } @else {
    <textarea #source data-markdown-source class="field markdown-source-editor__source" rows="10" [value]="draft()" [readOnly]="pending()"
      [attr.aria-label]="'Markdown source for ' + name()" [attr.aria-describedby]="failure() === null ? null : failureId"
      (input)="setDraft($event)"></textarea>
  }
  @if (changedElsewhere()) {
    <p data-markdown-changed-elsewhere class="markdown-source-editor__note" role="status">
      This section changed elsewhere since you started editing. Saving replaces it.
    </p>
  }
  @if (failure(); as failure) {
    <app-failure-message data-markdown-failed weight="inline" [failure]="failure" live="alert" [sentenceId]="failureId" />
  }
  <div class="markdown-source-editor__actions">
    <button data-markdown-preview type="button" class="button button--ghost" [attr.aria-pressed]="preview()"
      [attr.aria-disabled]="pending()" (click)="togglePreview()">Preview</button>
    <button data-markdown-save type="button" class="button button--primary" [attr.aria-disabled]="pending() || saveBlocked()"
      (click)="requestSave()">{{ pending() ? 'Saving…' : 'Save' }}</button>
    <button data-markdown-cancel type="button" class="button" [attr.aria-disabled]="pending()" (click)="requestCancel()">Cancel</button>
  </div>
</div>
