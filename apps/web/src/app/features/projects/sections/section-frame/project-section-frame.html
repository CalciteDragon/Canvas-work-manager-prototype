<section
  data-section-frame
  class="section-frame"
  [attr.data-section-type]="section().type"
  [attr.data-column-span]="section().columnSpan"
  [class.section-frame--collapsed]="section().collapsed"
  [attr.aria-labelledby]="'section-title-' + section().id"
>
  <header class="section-frame__header">
    @if (editMode()) {
      <span data-section-drag-handle cdkDragHandle class="section-frame__handle" aria-hidden="true"
        >â ¿</span
      >
    }

    <button
      data-section-collapse
      class="section-frame__collapse"
      type="button"
      [attr.aria-expanded]="!section().collapsed"
      [attr.aria-label]="(section().collapsed ? 'Expand ' : 'Collapse ') + name()"
      (click)="toggleCollapsed()"
    >
      {{ section().collapsed ? 'â–¸' : 'â–¾' }}
    </button>

    <h2 [id]="'section-title-' + section().id" class="section-frame__title">
      <span class="section-frame__icon" aria-hidden="true">{{ definition().icon }}</span>
      {{ name() }}
    </h2>

    @if (editMode()) {
      <div class="section-frame__controls">
        <label class="section-frame__size">
          <span>Size</span>
          <select
            data-section-size
            [value]="section().columnSpan"
            [attr.aria-label]="'Width of ' + name()"
            (change)="resize($any($event.target).value)"
          >
            @for (span of columnSpans; track span) {
              <option [value]="span" [selected]="span === section().columnSpan">{{ span }}</option>
            }
          </select>
        </label>

        <button
          data-section-config
          type="button"
          [attr.aria-expanded]="configOpen()"
          [attr.aria-label]="'Settings for ' + name()"
          (click)="toggleConfig()"
        >
          Settings
        </button>
        <button
          data-section-duplicate
          type="button"
          [attr.aria-label]="'Duplicate ' + name()"
          (click)="duplicateRequested.emit(section().id)"
        >
          Duplicate
        </button>
        <button
          data-section-remove
          class="section-frame__remove"
          type="button"
          [attr.aria-label]="'Remove ' + name()"
          (click)="removeRequested.emit(section().id)"
        >
          Remove
        </button>
      </div>
    }
  </header>

  @if (editMode() && configOpen()) {
    <div data-section-inspector class="section-frame__inspector">
      <!-- Every registered type has a name, so this is above the type-specific inspector
         rather than inside one — and it is why the "no settings" branch is gone. -->
      <label class="section-frame__name">
        <span>Name</span>
        <input
          data-section-name
          type="text"
          [value]="override()"
          [attr.placeholder]="definition().displayName"
          [attr.aria-label]="'Name of ' + name()"
          (change)="rename($any($event.target))"
        />
      </label>

      @if (definition().inspectorComponent; as inspector) {
        <ng-container [ngComponentOutlet]="inspector" [ngComponentOutletInputs]="contentInputs()" />
      }
    </div>
  }

  @if (!section().collapsed) {
    <div data-section-content class="section-frame__content">
      <ng-container
        [ngComponentOutlet]="definition().component"
        [ngComponentOutletInputs]="contentInputs()"
      />
    </div>
  }
</section>
