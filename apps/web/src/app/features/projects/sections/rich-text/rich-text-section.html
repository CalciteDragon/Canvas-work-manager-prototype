<div class="rich-text">
  <!-- No visible label: the frame's heading already names the section, and the textarea
       carries an `aria-label`. A visually-hidden one would be a second name for the same
       control. -->
  <textarea
    data-rich-text-body
    class="rich-text__body"
    rows="4"
    [value]="text()"
    [attr.aria-label]="'Notes for ' + name()"
    [readonly]="readOnly()"
    placeholder="What is this project about?"
    (blur)="save($any($event.target).value)"
  ></textarea>
</div>
