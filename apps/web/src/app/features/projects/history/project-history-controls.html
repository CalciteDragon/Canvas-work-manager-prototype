<div class="history-controls" role="group" aria-label="Project history">
  <button
    data-history-undo
    type="button"
    class="history-controls__button"
    [attr.aria-label]="undo().name"
    [attr.title]="undo().name"
    [attr.aria-disabled]="undo().enabled ? null : 'true'"
    (click)="requestUndo()"
  >
    <app-canvas-icon name="undo" />
  </button>
  <button
    data-history-redo
    type="button"
    class="history-controls__button"
    [attr.aria-label]="redo().name"
    [attr.title]="redo().name"
    [attr.aria-disabled]="redo().enabled ? null : 'true'"
    (click)="requestRedo()"
  >
    <app-canvas-icon name="redo" />
  </button>
  @if (retryAvailable()) {
    <button data-history-retry type="button" class="history-controls__retry" (click)="retryRequested.emit()">
      Retry
    </button>
  }
</div>
