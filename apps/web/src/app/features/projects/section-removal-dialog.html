<!-- Only a container still holding live rows gets here: a view, and an empty container,
   have already archived by the time this could render. The count is the domain's, so the
   question and the rule cannot disagree; the words around it are this component's. -->
<div
  data-section-removal-dialog
  class="removal-dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="removal-dialog-title"
  [attr.aria-busy]="pending()"
  tabindex="-1"
  (keydown)="keydown($event)"
>
  <div class="removal-dialog__panel">
    <h2 id="removal-dialog-title" class="removal-dialog__title">
      Remove “{{ prompt().sectionName }}”?
    </h2>
    <p data-section-removal-message class="removal-dialog__message">
      It still holds {{ rowCountLabel() }}. What should happen to them?
    </p>

    @if (targetOptions().length > 0) {
      <label class="removal-dialog__field">
        <span>Move them to</span>
        <select
          data-section-removal-target
          [value]="chosenTarget()"
          [attr.aria-disabled]="pending()"
          (change)="selectTarget($event)"
        >
          @for (target of targetOptions(); track target.id) {
            <option [value]="target.id">{{ target.label }}</option>
          }
        </select>
      </label>
    }

    <div class="removal-dialog__actions">
      <button data-section-removal-cancel type="button" [attr.aria-disabled]="pending()" (click)="cancel()">
        Keep the section
      </button>
      @if (targetOptions().length > 0) {
        <button
          data-section-removal-reassign
          type="button"
          [attr.aria-disabled]="pending()"
          (click)="reassign()"
        >
          Move the {{ rowNoun() }} out, then remove the section
        </button>
      }
      <!-- This policy keeps the section and the rows in Archive for canonical Restore. -->
      <button
        data-section-removal-cascade
        type="button"
        class="removal-dialog__danger"
        [attr.aria-disabled]="pending()"
        (click)="cascade()"
      >
        Archive the section and its {{ rowNoun() }}
      </button>
    </div>
  </div>
</div>
