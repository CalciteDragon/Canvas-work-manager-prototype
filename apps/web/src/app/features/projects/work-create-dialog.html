<div data-work-create-backdrop class="work-create-backdrop" (click)="close()">
  <section data-work-create-dialog class="work-create-dialog" role="dialog" aria-modal="true"
    aria-labelledby="work-create-title" [attr.aria-busy]="pending()" tabindex="-1"
    (click)="$event.stopPropagation()" (keydown)="keydown($event)">
    <h2 id="work-create-title">Add workstream</h2>
    <form class="work-create-dialog__form" (submit)="$event.preventDefault(); submit()">
      <label class="control-label">
        <span>Name</span>
        <input class="field" data-create-work-name type="text" required autocomplete="off" [value]="name()"
          [disabled]="pending()" (input)="setName($event)" />
      </label>
      <label class="control-label">
        <span>Parent</span>
        <select class="select" data-create-work-parent [disabled]="pending()" (change)="selectParent($event)">
          @for (parent of parentOptions(); track parent.id) {
            <option [value]="parent.id" [selected]="parent.id === selectedParentId()">{{ parentLabel(parent) }}</option>
          }
        </select>
      </label>
      @if (parentNote(); as note) {
        <p data-create-work-parent-note class="work-create-dialog__note" role="status">{{ note }}</p>
      }
      @if (error(); as message) {
        <p data-create-work-error class="work-create-dialog__error" role="alert">{{ message }}</p>
      }
      <p data-create-work-inside class="work-create-dialog__note">Inside {{ selectedParentName() }}</p>
      <footer>
        <button data-create-work-cancel type="button" class="button" [disabled]="pending()" (click)="close()">Cancel</button>
        <button data-create-work-submit type="submit" class="button button--primary" [disabled]="pending() || selectedParentId() === null">
          {{ pending() ? 'Creating…' : 'Create' }}
        </button>
      </footer>
    </form>
  </section>
</div>
