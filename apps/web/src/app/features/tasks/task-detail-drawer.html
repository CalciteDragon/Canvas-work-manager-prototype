<aside data-task-drawer class="drawer" role="complementary" aria-labelledby="task-drawer-title" (keydown.escape)="closed.emit()">
  <header class="drawer__header">
    <div>
      <span class="drawer__eyebrow">Task details</span>
      <h2 id="task-drawer-title">{{ task().title }}</h2>
    </div>
    <button data-close-drawer class="icon-button" type="button" aria-label="Close task details" (click)="closed.emit()">
      <app-icon name="close" />
    </button>
  </header>

  <p data-task-description class="drawer__description">
    {{ task().description || 'No description yet.' }}
  </p>

  <label class="control-label drawer__field">
    <span>Title</span>
    <input
      class="field"
      data-task-drawer-title
      type="text"
      [value]="draft()"
      [attr.aria-invalid]="titleError() !== null"
      (input)="updateDraft($any($event.target).value)"
      (blur)="commitTitle(true)"
      (keydown.enter)="commitTitle()"
      (keydown.escape)="escapeTitle($event)"
    />
    @if (titleError(); as error) {
      <span class="drawer__error" role="alert">{{ error }}</span>
    }
  </label>

  <label class="control-label drawer__field">
    <span>Priority</span>
    <select
      class="select"
      data-task-priority
      [value]="task().priority"
      (change)="changePriority($any($event.target).value)"
    >
      @for (priority of priorities; track priority) {
        <option [value]="priority" [selected]="priority === task().priority">{{ priority }}</option>
      }
    </select>
  </label>

  <label class="control-label drawer__field">
    <span>Due date</span>
    <input
      class="field"
      data-task-due-date
      type="date"
      [value]="dueDate()"
      (change)="changeDueDate($any($event.target).value)"
    />
  </label>

  <label class="control-label drawer__field">
    <span>Estimate</span>
    <input class="field" data-task-estimate type="number" min="0.1" step="0.5" [value]="task().estimate ?? ''" (change)="changeEstimate($any($event.target).value)" />
  </label>

  <dl class="drawer__facts">
    <div>
      <dt>Status</dt>
      <dd>{{ task().status }}</dd>
    </div>
    <div>
      <dt>Project</dt>
      <dd>{{ task().projectId }}</dd>
    </div>
  </dl>
</aside>
