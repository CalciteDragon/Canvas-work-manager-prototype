<article
  data-task-row
  class="task-row"
  [class.task-row--normal]="normal()"
  [class.task-row--overdue]="overdue()"
  [class.task-row--completed]="completed()"
  [class.task-row--high-priority]="task().priority === 'high'"
  [class.task-row--selected]="selected()"
  [class.task-row--compact]="compact()"
  [class.task-row--archiving]="archiving()"
  [attr.aria-busy]="pending() || archiving()"
>
  @if (!readOnly()) {
    <input
      data-task-complete
      class="task-row__checkbox"
      type="checkbox"
      [checked]="completed()"
      [disabled]="pending() || completed()"
      [attr.aria-label]="'Complete ' + task().title"
      (change)="requestCompletion()"
    />
  }

  <div class="task-row__body">
    @if (editing()) {
      <input
        data-task-title-editor
        #titleEditor
        class="task-row__title-editor"
        [value]="draftTitle()"
        [attr.aria-label]="'Edit title for ' + task().title"
        [attr.aria-invalid]="titleError() !== null"
        (input)="updateDraft($any($event.target).value)"
        (blur)="commitTitle()"
        (keydown.enter)="commitTitle()"
        (keydown.escape)="cancelEditing()"
      />
      @if (titleError(); as error) {
        <span data-title-error class="task-row__error">{{ error }}</span>
      }
    } @else if (readOnly()) {
      <span data-task-title class="task-row__title">{{ task().title }}</span>
    } @else {
      <button data-task-title class="task-row__title" type="button" (click)="beginEditing()">
        {{ task().title }}
      </button>
    }

    <div class="task-row__metadata">
      <span class="task-row__priority">{{ task().priority }} priority</span>
      @if (task().dueAt; as dueAt) {
        <time [attr.datetime]="dueAt">Due {{ dueAt.slice(0, 10) }}</time>
      }
      @if (overdue()) {
        <span class="task-row__overdue-label">Overdue</span>
      }
    </div>
  </div>

  @if (!readOnly()) {
    <button
      data-task-details
      class="task-row__details"
      type="button"
      [attr.aria-pressed]="selected()"
      [attr.aria-label]="'Open details for ' + task().title"
      (click)="selectedRequested.emit(task().id)"
    >
      Details
    </button>

    <button
      data-task-archive
      class="task-row__archive"
      type="button"
      [disabled]="archiving()"
      [attr.aria-label]="'Archive ' + task().title"
      (click)="requestArchive()"
    >
      {{ archiving() ? 'Archiving…' : 'Archive' }}
    </button>
  }
</article>
