<article
  #row
  data-task-row
  [attr.data-task-id]="task().id"
  [class.task-row--read-only]="readOnly()"
  (click)="selectBackground($event)"
  class="task-row object-row"
  [class.object-row--finished]="completed()"
  [class.object-row--overdue]="overdue()"
  [class.object-row--high-priority]="task().priority === 'high'"
  [class.object-row--static]="readOnly() && !link()"
  [class.task-row--normal]="normal()"
  [class.task-row--overdue]="overdue()"
  [class.task-row--completed]="completed()"
  [class.task-row--high-priority]="task().priority === 'high'"
  [class.task-row--selected]="selected()"
  [class.task-row--compact]="compact()"
  [class.task-row--archiving]="archiving()"
  [class.task-row--failed]="shownError() !== null"
  [attr.aria-busy]="pending() || archiving()"
>
  @if (!readOnly()) {
    <input
      data-task-complete
      class="checkbox task-row__checkbox object-row__control"
      type="checkbox"
      [checked]="completed()"
      [attr.aria-disabled]="pending()"
      [attr.aria-describedby]="shownError() === null ? null : errorId()"
      [attr.aria-label]="(completed() ? 'Reopen task ' : 'Complete ') + task().title"
      (change)="toggleCompletion($event)"
    />
  }

  <div class="task-row__body">
    @if (link(); as owner) {
      <a data-task-title class="link task-row__title object-row__title" [routerLink]="owner.route" [fragment]="owner.fragment">{{ task().title }}</a>
    } @else if (readOnly()) {
      <span data-task-title class="task-row__title object-row__title">{{ task().title }}</span>
    } @else {
      <button
        data-task-title
        class="task-row__title object-row__title"
        type="button"
        [attr.aria-label]="task().title + ', open details'"
        [attr.aria-current]="selected() ? true : null"
        (click)="selectTitle($event)"
      >
        {{ task().title }}
      </button>
    }

    <div class="task-row__metadata object-row__meta">
      @for (item of meta(); track item.kind) {
        @if (item.datetime) { <time [attr.datetime]="item.datetime">{{ item.text }}</time> }
        @else { <span [class.task-row__overdue-label]="item.kind === 'overdue'">{{ item.text }}</span> }
      }
    </div>
    @if (shownError(); as failure) {
      <app-failure-message data-task-error class="object-row__context" weight="inline" [failure]="failure" live="alert" [sentenceId]="errorId()" />
    }
  </div>

  @if (!readOnly()) {
    <button
      data-task-delete
      class="tool task-row__delete object-row__tools"
      type="button"
      [attr.aria-disabled]="archiving() ? 'true' : null"
      [attr.aria-label]="'Delete task ' + task().title"
      [attr.title]="'Delete task ' + task().title"
      (click)="requestDelete()"
    >
      <app-icon name="remove" />
    </button>
  }
</article>
