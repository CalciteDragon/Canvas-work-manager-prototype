<article
  #row
  data-task-row
  [attr.data-task-id]="task().id"
  [class.task-row--read-only]="readOnly()"
  (click)="selectBackground($event)"
  class="task-row"
  [class.task-row--normal]="normal()"
  [class.task-row--overdue]="overdue()"
  [class.task-row--completed]="completed()"
  [class.task-row--high-priority]="task().priority === 'high'"
  [class.task-row--selected]="selected()"
  [class.task-row--compact]="compact()"
  [class.task-row--archiving]="archiving()"
  [attr.aria-busy]="pending() || archiving()"
>
  @if (!readOnly()) {
    <input
      data-task-complete
      class="checkbox task-row__checkbox"
      type="checkbox"
      [checked]="completed()"
      [attr.aria-disabled]="pending()"
      [attr.aria-label]="(completed() ? 'Reopen task ' : 'Complete ') + task().title"
      (change)="toggleCompletion($event)"
    />
  }

  <div class="task-row__body">
    @if (readOnly()) {
      <span data-task-title class="task-row__title">{{ task().title }}</span>
    } @else {
      <button
        data-task-title
        class="task-row__title"
        type="button"
        [attr.aria-label]="task().title + ', open details'"
        [attr.aria-current]="selected() ? true : null"
        (click)="selectTitle($event)"
      >
        {{ task().title }}
      </button>
    }

    <div class="task-row__metadata">
      <span class="task-row__priority">{{ task().priority }} priority</span>
      @if (task().dueAt; as dueAt) {
        <time [attr.datetime]="dueAt">Due {{ dueAt.slice(0, 10) }}</time>
      }
      @if (overdue()) {
        <span class="task-row__overdue-label">Overdue</span>
      }
    </div>
  </div>

  @if (!readOnly()) {
    <button
      data-task-delete
      class="tool task-row__delete"
      type="button"
      [disabled]="archiving()"
      [attr.aria-label]="'Delete task ' + task().title"
      [attr.title]="'Delete task ' + task().title"
      (click)="requestDelete()"
    >
      <app-icon name="remove" />
    </button>
  }
</article>
