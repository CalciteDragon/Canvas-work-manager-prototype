packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 does not run dependency build scripts unless they are approved here.
# Without this, `pnpm install` fails with ERR_PNPM_IGNORED_BUILDS — and if it did not,
# Angular would fail later on a missing esbuild binary. All four are Angular's own
# build/dev-server toolchain.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

# pnpm 11 defaults `minimumReleaseAge` to 1440 minutes, so a *fresh* resolve otherwise
# silently picks an older version or fails outright against Storybook's exact-version
# internal peer pins. These entries are the versions this workspace was resolved against
# and accepted.
#
# The Storybook set has a real maintenance cost worth naming: it releases weekly, and every
# entry here is an exact version, so a resolve that moves forward has to regenerate them.
minimumReleaseAgeExclude:
  - '@analogjs/vite-plugin-angular@2.7.1'
  - '@angular-devkit/architect@0.2201.6'
  - '@angular-devkit/core@22.1.6'
  - '@angular-devkit/schematics@22.1.6'
  - '@angular/build@22.1.6'
  - '@angular/cli@22.1.6'
  - '@schematics/angular@22.1.6'
  - '@storybook/addon-themes@10.5.10'
  - '@storybook/angular-vite@10.5.10'
  - '@types/node@24.13.3'
  - 'sass@1.103.1'
  - 'storybook@10.5.10'
  - 'vite@8.2.2'
